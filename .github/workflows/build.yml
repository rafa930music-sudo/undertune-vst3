name: Build Undertune VST3

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows-vst3:
    name: Build VST3 (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64 Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Undertune VST3
        run: cmake --build build --config Release --target Undertune_VST3 --parallel

      - name: Archive VST3 Plugin
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Filter "Undertune.vst3" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "VST3 encontrado en: $vst3"
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path $vst3 -DestinationPath "dist/Undertune-VST3-Windows-x64.zip" -Force

      - name: Upload VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Undertune-VST3-Windows-x64
          path: dist/Undertune-VST3-Windows-x64.zip
          retention-days: 90
